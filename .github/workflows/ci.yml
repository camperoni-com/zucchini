name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint, types and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  packed:
    name: Packed install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Builds and packs the package, installs the tarball into a throwaway project with only the peer
      # dependencies, and imports and type-checks it there.
      - run: npm run test:packed

  release-dry-run:
    name: Release dry run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The next release and a `next` prerelease, as dry runs from the packed package.
      - run: npm run release:dry-run

  demo:
    name: Demo contracts (${{ matrix.browser }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    defaults:
      run:
        working-directory: examples/demo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            examples/demo/package-lock.json
      - run: npm ci
        working-directory: .
      # The demo's own dependencies, plus Zucchini from the packed tarball, as a user gets it from npm.
      - run: npm run demo:install
        working-directory: .
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npm run typecheck
      - run: npm run catalog:check
      - run: npm run lint
      # Desktop and mobile.
      - run: npm run contracts -- --browser ${{ matrix.browser }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: demo-results-${{ matrix.browser }}
          path: examples/demo/test-results/zucchini.json
          if-no-files-found: ignore

  mutation:
    name: Demo mutation check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/demo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            examples/demo/package-lock.json
      - run: npm ci
        working-directory: .
      - run: npm run demo:install
        working-directory: .
      - run: npx playwright install --with-deps chromium
      # Every deliberate break in zucchini.breaks.ts, on Chromium desktop and mobile. A missed break fails.
      - run: npm run mutation

  site:
    name: Demo site
    # Built from whatever the contract runs recorded, failures included: showing them is the living spec's job.
    needs: demo
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/demo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            examples/demo/package-lock.json
      - run: npm ci
        working-directory: .
      - run: npm run demo:install
        working-directory: .
      - uses: actions/download-artifact@v4
        with:
          pattern: demo-results-*
          path: examples/demo/ci-results
      # One results file for the three browsers, which the living spec reads at build time.
      - run: npx zucchini merge-results ci-results/*/zucchini.json
      - run: npm run build-storybook
      - uses: actions/upload-artifact@v4
        with:
          name: demo-site
          path: examples/demo/storybook-static
      - uses: actions/upload-pages-artifact@v3
        with:
          path: examples/demo/storybook-static

  pages:
    name: Deploy the demo to GitHub Pages
    needs: site
    # Off until the repo is public: on GitHub's Team plan a private repo's Pages site is public. Going public
    # sets the DEMO_PAGES repository variable to true.
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEMO_PAGES == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
